<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irvine Rainfall by Month, 2019–2022</title>
<meta name="description" content="Total monthly rainfall in Irvine, California, with one line per year. The 2022 data runs through August.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Chivo+Mono:wght@400;600&display=swap">
<style>
  /* One chart on graph paper: title, the matplotlib figure on a white card, then notes and links. */
  :root {
    --paper: #eef3f7; --board: #fbfdff; --grid: #cfe0ee; --grid-major: #a9c6de;
    --ink: #1d2a44; --ink-soft: #5b6a85; --apple: #d6372b;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Chivo Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0c1830; --board: #10203d; --grid: #1c3358; --grid-major: #2a4a7a;
      --ink: #e8f0ff; --ink-soft: #8ea3c7; --apple: #ff6a55; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0c1830; --board: #10203d; --grid: #1c3358; --grid-major: #2a4a7a;
    --ink: #e8f0ff; --ink-soft: #8ea3c7; --apple: #ff6a55; color-scheme: dark;
  }
  body {
    margin: 0; color: var(--ink); font-family: var(--font-mono);
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .home { align-self: flex-start; font-size: 0.8rem; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--grid-major); }
  .home:hover { border-bottom-color: var(--apple); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.6rem); letter-spacing: -0.03em; line-height: 1.05; margin: 0; text-wrap: balance; }
  .lede { margin: 0; color: var(--ink-soft); font-size: 0.85rem; line-height: 1.6; max-width: 70ch; }
  figure { margin: 0; background: #fff; border: 2px solid var(--ink); border-radius: 4px; box-shadow: 6px 6px 0 var(--grid-major); padding: 12px; }
  figure img { display: block; width: 100%; height: auto; }
  .notes { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-size: 0.8rem; color: var(--ink-soft); }
  .notes a { color: var(--ink); font-weight: 600; text-decoration-color: var(--grid-major); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--apple); }
  a:focus-visible { outline: 3px solid var(--apple); outline-offset: 3px; }
</style>

<div class="wrap">
  <a class="home" href="https://mentalplatypus.github.io/">← David Wang</a>
  <h1>Irvine Rainfall by Month, 2019–2022</h1>
  <p class="lede">Total monthly rainfall in Irvine, California, with one line per year. The 2022 data runs through August.</p>
  <figure>
    <img src="chart.png" alt="Line chart of monthly rainfall in Irvine from 2019 to 2022. Most months get under one inch. The wettest months are February 2019 at about 6.6 inches, December 2021 at about 5.7 inches and April 2020 at about 5.3 inches.">
  </figure>
  <div class="notes">
    <span>Data: <a href="https://ceorange.ucanr.edu/about/weather/?weather=station&amp;station=75">UC Cooperative Extension Orange County weather station</a></span>
    <span>Made with Python, pandas and matplotlib · <a href="https://github.com/mentalplatypus/Irvine-Rainfall-Data">View the code</a></span>
  </div>
</div>
